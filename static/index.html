<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6C2BD9">
<title>Karma AI</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<style>
:root{--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#25254a;--surface3:#2d2d52;--accent:#7C3AED;--accent2:#A855F7;--gemini:#4285F4;--text:#e8e8f0;--text-dim:#9090b0;--bubble-user:#6D28D9;--bubble-ai:#25254a;--radius:16px;--radius-sm:10px;--sidebar-w:280px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;height:100vh;overflow:hidden}
.icon{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon svg{width:100%;height:100%}

/* Sidebar */
#sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;transition:transform .3s;flex-shrink:0;z-index:50}
#sidebar.closed{transform:translateX(calc(-1 * var(--sidebar-w)));position:fixed;height:100%}
.sidebar-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-header .logo{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center}
.sidebar-header .logo .icon{width:18px;height:18px;color:#fff}
.sidebar-header h2{font-size:15px;font-weight:600}
.new-chat-btn{margin:12px;padding:10px;border-radius:10px;border:none;cursor:pointer;background:var(--accent);color:#fff;font-size:13px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.new-chat-btn .icon{width:18px;height:18px}
#sessions-list{flex:1;overflow-y:auto;padding:4px 8px}
.session-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-dim);transition:all .15s;margin-bottom:2px}
.session-item:hover{background:var(--surface2)}
.session-item.active{background:var(--surface3);color:var(--text)}
.session-item .icon{width:16px;height:16px;opacity:.5}
.session-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-item .del{opacity:0;width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.session-item:hover .del{opacity:.7}
.session-item .del:hover{opacity:1;color:#ff6b6b}
.sidebar-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06)}

/* Main area */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Header */
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,var(--accent),var(--accent2));flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.3);transition:background .3s}
header.gemini-active{background:linear-gradient(135deg,var(--gemini),#1a73e8)}
header .menu-btn{background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:none}
header .menu-btn .icon{width:22px;height:22px}
header .logo{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
header .logo .icon{width:20px;height:20px;color:#fff}
header h1{font-size:16px;font-weight:600;color:#fff}
header .subtitle{font-size:11px;color:rgba(255,255,255,.65)}

/* Language dropdown */
.lang-select{margin-left:auto;background:rgba(0,0,0,.2);border:none;color:#fff;font-size:12px;font-weight:600;font-family:inherit;padding:6px 8px;border-radius:8px;cursor:pointer;outline:none}
.lang-select option{background:var(--surface);color:var(--text)}

/* Tab bar */
.tab-bar{display:flex;background:var(--surface);flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06)}
.tab-bar button{flex:1;border:none;cursor:pointer;padding:10px;background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:2px solid transparent;transition:all .2s}
.tab-bar button.active{color:var(--accent2);border-bottom-color:var(--accent2)}
.tab-bar button .icon{width:18px;height:18px}

/* Pages */
.page{flex:1;overflow:hidden;display:none;flex-direction:column}
.page.active{display:flex}

/* Provider bar */
.provider-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:var(--surface);border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0;scrollbar-width:none}
.provider-bar::-webkit-scrollbar{display:none}
.provider-bar button{border:none;cursor:pointer;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;font-family:inherit;background:var(--surface2);color:var(--text-dim);transition:all .2s;display:flex;align-items:center;gap:5px}
.provider-bar button .dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim)}
.provider-bar button.configured .dot{background:#4ade80}
.provider-bar button.active{background:var(--accent);color:#fff}
.provider-bar button.active .dot{background:#fff}

/* Chat */
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{max-width:85%;padding:10px 14px;border-radius:var(--radius);line-height:1.5;font-size:14px;word-wrap:break-word;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:var(--bubble-user);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bubble-ai);border:1px solid rgba(255,255,255,.06);border-bottom-left-radius:4px}
.msg .tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.45;margin-bottom:3px}
.msg.error{background:#3a1517;border:1px solid #5c1d1f;color:#ff9a9a;align-self:center;font-size:12px}
.msg pre{background:rgba(0,0,0,.3);border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0;font-size:12px}
.msg code{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:12px}
.msg p{margin:4px 0}
.msg ul,.msg ol{margin:4px 0 4px 20px}
.msg li{margin:2px 0}
.msg strong{font-weight:700}
.msg em{font-style:italic}
.msg a{color:var(--accent2);text-decoration:underline}
.msg h1,.msg h2,.msg h3{margin:6px 0 4px;font-size:15px;font-weight:700}
.msg table{border-collapse:collapse;width:100%;margin:6px 0}
.msg th,.msg td{border:1px solid rgba(255,255,255,.1);padding:4px 8px;font-size:12px}
.msg blockquote{border-left:3px solid var(--accent);padding-left:10px;margin:6px 0;opacity:.8}
.msg .msg-image{max-width:200px;border-radius:8px;margin-top:6px}
.msg-actions{display:flex;gap:6px;margin-top:4px}
.msg-actions button{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:11px;display:flex;align-items:center;gap:3px;padding:2px 4px;border-radius:4px}
.msg-actions button:hover{color:var(--text);background:rgba(255,255,255,.08)}
.msg-actions button .icon{width:14px;height:14px}
.typing{display:flex;gap:4px;align-self:flex-start;padding:12px 16px;background:var(--bubble-ai);border-radius:var(--radius);border-bottom-left-radius:4px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--text-dim);animation:blink 1.4s infinite both}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* Input bar */
#input-bar{display:flex;gap:6px;padding:8px 10px;background:var(--surface);border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#input{flex:1;resize:none;background:var(--surface2);border:1px solid rgba(255,255,255,.08);color:var(--text);border-radius:24px;padding:10px 14px;font-size:14px;max-height:100px;line-height:1.4;outline:none;font-family:inherit}
#input:focus{border-color:var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;background:var(--surface2);color:var(--text-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.icon-btn:hover{color:var(--text);background:var(--surface3)}
.icon-btn:active{transform:scale(.9)}
.icon-btn .icon{width:20px;height:20px}
.icon-btn.recording{background:#ff3b30;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
#send{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s}
#send .icon{width:20px;height:20px}
#send:active{transform:scale(.9)}
#send:disabled{opacity:.4}
.image-preview{position:relative;display:none}
.image-preview img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.image-preview .remove-img{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#ff3b30;border:none;color:#fff;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
.image-preview.active{display:block}

/* Tools page */
#tools-page{flex:1;overflow-y:auto}
.tools-header{padding:14px 16px 8px}
.tools-header h2{font-size:16px;font-weight:600}
.tools-header p{font-size:12px;color:var(--text-dim);margin-top:2px}
.tools-search{margin:8px 16px 12px}
.tools-search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:var(--surface2);color:var(--text);font-size:14px;outline:none;font-family:inherit}
.tools-search input:focus{border-color:var(--accent)}
.tool-category{margin-bottom:16px}
.tool-category h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);padding:0 16px 8px}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:0 12px}
.tool-card{background:var(--surface2);border:1px solid rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:14px 12px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.tool-card:hover,.tool-card:active{background:var(--surface3);border-color:var(--accent);transform:translateY(-2px)}
.tool-card .icon{width:28px;height:28px;color:var(--accent2)}
.tool-card .name{font-size:12px;font-weight:600;line-height:1.3}
.tool-card.live{border-color:rgba(74,222,128,.3)}
.tool-card .live-badge{font-size:8px;font-weight:700;color:#4ade80;background:rgba(74,222,128,.15);padding:2px 6px;border-radius:8px;letter-spacing:.5px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;gap:10px}
.modal-header .icon{width:24px;height:24px;color:var(--accent2)}
.modal-header h3{font-size:16px;font-weight:600;flex:1}
.modal-header .close-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);padding:4px}
.modal-header .close-btn .icon{width:20px;height:20px}
.modal textarea{width:100%;min-height:80px;resize:vertical;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:var(--surface2);color:var(--text);padding:12px;font-size:14px;outline:none;font-family:inherit;line-height:1.5}
.modal textarea:focus{border-color:var(--accent)}
.modal .run-btn{border:none;cursor:pointer;padding:12px;border-radius:12px;font-size:14px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.modal .run-btn:active{transform:scale(.97)}
.modal .run-btn:disabled{opacity:.5}
.modal .run-btn .icon{width:18px;height:18px}
.modal .result{background:var(--surface2);border-radius:12px;padding:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;display:none;border:1px solid rgba(255,255,255,.06)}
.modal .result.active{display:block}
.modal .result pre{background:rgba(0,0,0,.3);border-radius:8px;padding:8px;overflow-x:auto;margin:4px 0;font-size:12px}
.modal .result code{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:12px}
.modal .result a{color:var(--accent2);text-decoration:underline}
.modal .result strong{font-weight:700}
.modal .result ul,.modal .result ol{margin:4px 0 4px 20px}
.modal .result-actions{display:flex;gap:8px}
.modal .result-actions button{border:none;cursor:pointer;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:var(--surface3);color:var(--text);font-family:inherit;display:flex;align-items:center;gap:5px}
.modal .result-actions button .icon{width:15px;height:15px}

/* Scrollbar */
#chat::-webkit-scrollbar,#tools-page::-webkit-scrollbar,#sessions-list::-webkit-scrollbar{width:4px}
#chat::-webkit-scrollbar-thumb,#tools-page::-webkit-scrollbar-thumb,#sessions-list::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:4px}

/* Mobile */
@media(max-width:768px){
  #sidebar{position:fixed;height:100%;z-index:100}
  header .menu-btn{display:flex}
}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <div class="logo"><span class="icon" id="ic-logo"></span></div>
    <h2>Karma AI</h2>
  </div>
  <button class="new-chat-btn" onclick="newChat()"><span class="icon" id="ic-plus"></span> New Chat</button>
  <div id="sessions-list"></div>
</div>

<div id="main">
  <header id="header">
    <button class="menu-btn" onclick="toggleSidebar()"><span class="icon" id="ic-menu"></span></button>
    <div class="logo"><span class="icon" id="ic-bot"></span></div>
    <div>
      <h1>Karma AI</h1>
      <div class="subtitle" id="subtitle">9 Providers · 76 Tools · 9 Languages</div>
    </div>
    <select class="lang-select" id="lang-select" onchange="setLang(this.value)">
      <option value="english">English</option>
      <option value="hindi">हिंदी Hindi</option>
      <option value="hinglish">Hinglish</option>
      <option value="tamil">தமிழ் Tamil</option>
      <option value="telugu">తెలుగు Telugu</option>
      <option value="bengali">বাংলা Bengali</option>
      <option value="marathi">मराठी Marathi</option>
      <option value="punjabi">ਪੰਜਾਬੀ Punjabi</option>
      <option value="gujarati">ગુજરાતી Gujarati</option>
    </select>
  </header>

  <div class="tab-bar">
    <button id="tab-chat" class="active" onclick="switchTab('chat')"><span class="icon" id="ic-chat"></span> Chat</button>
    <button id="tab-tools" onclick="switchTab('tools')"><span class="icon" id="ic-tools"></span> Tools</button>
  </div>

  <div id="chat-page" class="page active">
    <div class="provider-bar" id="provider-bar"></div>
    <div id="chat"></div>
    <div id="input-bar">
      <button class="icon-btn" id="mic-btn" onclick="toggleVoice()" title="Voice input"><span class="icon" id="ic-mic"></span></button>
      <button class="icon-btn" id="img-btn" onclick="document.getElementById('img-file').click()" title="Upload image (Gemini only)"><span class="icon" id="ic-upload"></span></button>
      <input type="file" id="img-file" accept="image/*" style="display:none" onchange="handleImage(event)">
      <div class="image-preview" id="img-preview"><img id="img-thumb"><button class="remove-img" onclick="removeImage()">x</button></div>
      <textarea id="input" rows="1" placeholder="Type a message..." autocomplete="off"></textarea>
      <button id="send" onclick="send()"><span class="icon" id="ic-send"></span></button>
    </div>
  </div>

  <div id="tools-page" class="page">
    <div class="tools-header">
      <h2>AI Tools</h2>
      <p id="tools-desc">76 tools (50 AI + 26 live data) — live tools need no API key.</p>
    </div>
    <div class="tools-search">
      <input id="tools-search-input" type="text" placeholder="Search tools..." oninput="filterTools()">
    </div>
    <div id="tools-list"></div>
  </div>
</div>

<div class="modal-overlay" id="tool-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="icon" id="modal-icon"></span>
      <h3 id="modal-title">Tool</h3>
      <button class="close-btn" onclick="closeModal()"><span class="icon" id="ic-close"></span></button>
    </div>
    <textarea id="modal-input" placeholder="Enter your input..."></textarea>
    <button class="run-btn" id="modal-run" onclick="runTool()"><span class="icon" id="ic-run"></span> Run Tool</button>
    <div class="result" id="modal-result"></div>
    <div class="result-actions" id="modal-actions" style="display:none;">
      <button onclick="copyResult()"><span class="icon" id="ic-copy"></span> Copy</button>
    </div>
  </div>
</div>

<script src="/marked.min.js"></script>
<script src="/icons.js"></script>
<script src="/tools.js"></script>
<script>
// === State ===
let provider='sarvam', language='english', providersData={};
let sessions=[], currentSessionId=null;
let imageData=null, imageMime=null;
let recognition=null, isRecording=false;

// === Init icons ===
const setIcon=(id,name)=>{document.getElementById(id).innerHTML=ICONS[name]||ICONS.sparkle};
setIcon('ic-logo','sparkle');setIcon('ic-plus','plus');setIcon('ic-menu','menu');setIcon('ic-bot','sparkle');
setIcon('ic-chat','chat');setIcon('ic-tools','tools');setIcon('ic-send','send');setIcon('ic-mic','mic2');
setIcon('ic-upload','upload');setIcon('ic-close','close');setIcon('ic-run','zap');setIcon('ic-copy','copy');

// === Sessions (localStorage persistence) ===
function loadSessions(){
  try{sessions=JSON.parse(localStorage.getItem('ai_sessions')||'[]')}catch(e){sessions=[]}
  if(sessions.length===0)newChat();else{currentSessionId=sessions[0].id;renderSessions();renderChat()}
}
function saveSessions(){localStorage.setItem('ai_sessions',JSON.stringify(sessions))}
function newChat(){
  const s={id:'s'+Date.now(),title:'New Chat',messages:[],created:Date.now()};
  sessions.unshift(s);currentSessionId=s.id;saveSessions();renderSessions();renderChat();
  if(window.innerWidth<=768)document.getElementById('sidebar').classList.add('closed');
}
function deleteSession(id){
  sessions=sessions.filter(s=>s.id!==id);
  if(currentSessionId===id){currentSessionId=sessions.length?sessions[0].id:null;if(!currentSessionId)newChat();else renderChat()}
  saveSessions();renderSessions();
}
function getSession(){return sessions.find(s=>s.id===currentSessionId)}
function renderSessions(){
  const list=document.getElementById('sessions-list');
  list.innerHTML='';
  sessions.forEach(s=>{
    const div=document.createElement('div');
    div.className='session-item'+(s.id===currentSessionId?' active':'');
    div.innerHTML='<span class="icon">'+ICONS.chat+'</span><span class="name">'+(s.title||'New Chat')+'</span>';
    const del=document.createElement('button');del.className='del';del.innerHTML=ICONS.trash;del.onclick=(e)=>{e.stopPropagation();deleteSession(s.id)};
    div.appendChild(del);div.onclick=()=>{currentSessionId=s.id;renderSessions();renderChat();if(window.innerWidth<=768)document.getElementById('sidebar').classList.add('closed')};
    list.appendChild(div);
  });
}

// === Chat rendering with markdown ===
function renderChat(){
  const chatEl=document.getElementById('chat');
  const s=getSession();if(!s){chatEl.innerHTML='';return}
  chatEl.innerHTML='';
  if(s.messages.length===0){
    const welcome='Welcome to Karma AI! I am your assistant with 9 providers and 76 tools. Ask me anything! I support English, Hindi, Hinglish, Tamil, Telugu, Bengali, Marathi, Punjabi, and Gujarati.';
    addMsg(welcome,'ai');
    return;
  }
  s.messages.forEach(m=>{
    if(m.role==='user')addMsg(m.content,'user',null,m.image);
    else{const tag=providersData[m.provider]?.label||m.provider||'AI';addMsg(m.content,'ai',tag)}
  });
}

function addMsg(text,who,tag,img){
  const chatEl=document.getElementById('chat');
  const div=document.createElement('div');div.className='msg '+who;
  if(tag){const t=document.createElement('div');t.className='tag';t.textContent=tag;div.appendChild(t)}
  if(who==='ai'){
    // Render markdown
    const body=document.createElement('div');
    try{body.innerHTML=marked.parse(text)}catch(e){body.textContent=text}
    div.appendChild(body);
    // Actions: copy + speak
    const actions=document.createElement('div');actions.className='msg-actions';
    const copyB=document.createElement('button');copyB.innerHTML=ICONS.copy+' Copy';copyB.onclick=()=>{navigator.clipboard.writeText(text)};
    const speakB=document.createElement('button');speakB.innerHTML=ICONS.speaker+' Speak';speakB.onclick=()=>speak(text);
    actions.appendChild(copyB);actions.appendChild(speakB);div.appendChild(actions);
  }else{
    const body=document.createElement('div');body.textContent=text;div.appendChild(body);
    if(img){const im=document.createElement('img');im.className='msg-image';im.src=img;div.appendChild(im)}
  }
  chatEl.appendChild(div);chatEl.scrollTop=chatEl.scrollHeight;
  return div;
}

// === Send message ===
const inputEl=document.getElementById('input');
const sendBtn=document.getElementById('send');
inputEl.addEventListener('input',()=>{inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,100)+'px'});
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

async function send(){
  const text=inputEl.value.trim();if(!text)return;
  inputEl.value='';inputEl.style.height='auto';sendBtn.disabled=true;
  const s=getSession();
  // Save user message
  const userMsg={role:'user',content:text};
  if(imageData){userMsg.image=imageData}
  s.messages.push(userMsg);
  // Update session title if first message
  if(s.messages.length===1)s.title=text.substring(0,40);
  saveSessions();renderSessions();
  addMsg(text,'user',null,imageData);
  // Typing
  const typing=document.createElement('div');typing.className='typing';typing.innerHTML='<span></span><span></span><span></span>';
  document.getElementById('chat').appendChild(typing);document.getElementById('chat').scrollTop=999999;
  // API call
  const msgCopy=s.messages.map(m=>({role:m.role,content:m.content}));
  try{
    const body={messages:msgCopy,provider,language};
    if(imageData&&provider==='gemini'){body.image=imageData;body.image_mime=imageMime}
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json();
    typing.remove();
    if(data.error){addMsg(data.error,'error')}
    else{
      const tag=providersData[provider]?.label||provider;
      addMsg(data.reply,'ai',tag);
      s.messages.push({role:'assistant',content:data.reply,provider});
      saveSessions();
    }
  }catch(err){typing.remove();addMsg('Connection failed. Is the server running?','error')}
  // Clear image
  removeImage();
  sendBtn.disabled=false;inputEl.focus();
}

// === Image upload ===
function handleImage(event){
  const file=event.target.files[0];if(!file)return;
  imageMime=file.type;
  const reader=new FileReader();
  reader.onload=(e)=>{
    imageData=e.target.result.split(',')[1]; // base64 without prefix
    document.getElementById('img-thumb').src=e.target.result;
    document.getElementById('img-preview').classList.add('active');
    if(provider!=='gemini'){addMsg('Note: Image upload works with Gemini provider only. Switch to Gemini to analyze images.','error')}
  };
  reader.readAsDataURL(file);
}
function removeImage(){imageData=null;imageMime=null;document.getElementById('img-preview').classList.remove('active');document.getElementById('img-file').value=''}

// === Voice input (Web Speech API) ===
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Voice input not supported in this browser. Try Chrome.');return}
  if(isRecording){recognition.stop();return}
  recognition=new SR();
  recognition.continuous=false;recognition.interimResults=true;
  const langMap={english:'en-US',hindi:'hi-IN',hinglish:'hi-IN',tamil:'ta-IN',telugu:'te-IN',bengali:'bn-IN',marathi:'mr-IN',punjabi:'pa-IN',gujarati:'gu-IN'};
  recognition.lang=langMap[language]||'en-US';
  recognition.onstart=()=>{isRecording=true;document.getElementById('mic-btn').classList.add('recording')};
  recognition.onend=()=>{isRecording=false;document.getElementById('mic-btn').classList.remove('recording')};
  recognition.onresult=(e)=>{
    let text='';for(let i=0;i<e.results.length;i++)text+=e.results[i][0].transcript;
    inputEl.value=text;inputEl.focus();
  };
  recognition.start();
}

// === Voice output (speak) ===
function speak(text){
  if(!window.speechSynthesis){return}
  window.speechSynthesis.cancel();
  const clean=text.replace(/[#*`>_~]/g,'').replace(/\n/g,' ');
  const utter=new SpeechSynthesisUtterance(clean);
  utter.rate=1;utter.pitch=1;
  const langMap={english:'en-US',hindi:'hi-IN',hinglish:'hi-IN',tamil:'ta-IN',telugu:'te-IN',bengali:'bn-IN',marathi:'mr-IN',punjabi:'pa-IN',gujarati:'gu-IN'};
  utter.lang=langMap[language]||'en-US';
  window.speechSynthesis.speak(utter);
}

// === Language ===
function setLang(lang){
  language=lang;
  const placeholders={english:'Type a message...',hindi:'संदेश लिखें...',hinglish:'Message likho...',tamil:'செய்தி எழுதுங்கள்...',telugu:'సందేశం రాయండి...',bengali:'বার্তা লিখুন...',marathi:'संदेश लिहा...',punjabi:'ਸੁਨੇਹਾ ਲਿਖੋ...',gujarati:'સંદેશ લખો...'};
  inputEl.placeholder=placeholders[lang]||placeholders.english;
}

// === Tabs ===
function switchTab(tab){
  document.getElementById('chat-page').classList.toggle('active',tab==='chat');
  document.getElementById('tools-page').classList.toggle('active',tab==='tools');
  document.getElementById('tab-chat').classList.toggle('active',tab==='chat');
  document.getElementById('tab-tools').classList.toggle('active',tab==='tools');
}

// === Sidebar toggle ===
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('closed')}

// === Provider bar ===
async function loadProviders(){
  try{
    const res=await fetch('/api/providers');providersData=await res.json();renderProviderBar();
  }catch(e){
    providersData={sarvam:{label:'Sarvam',desc:'',model:'',configured:true},gemini:{label:'Gemini',desc:'',model:'',configured:true}};
    renderProviderBar();
  }
}
function renderProviderBar(){
  const bar=document.getElementById('provider-bar');bar.innerHTML='';
  Object.entries(providersData).forEach(([pid,p])=>{
    const btn=document.createElement('button');
    btn.className=(p.configured?'configured':'')+(pid===provider?' active':'');
    btn.innerHTML='<span class="dot"></span>'+p.label;btn.title=p.desc||p.label;
    btn.onclick=()=>{provider=pid;renderProviderBar()};
    bar.appendChild(btn);
  });
}

// === Tools ===
function renderTools(filter){
  const list=document.getElementById('tools-list');list.innerHTML='';
  Object.entries(TOOL_CATEGORIES).forEach(([cat,tools])=>{
    const filtered=filter?tools.filter(t=>t.name.toLowerCase().includes(filter.toLowerCase())):tools;
    if(!filtered.length)return;
    const sec=document.createElement('div');sec.className='tool-category';
    sec.innerHTML='<h3>'+cat+'</h3>';
    const grid=document.createElement('div');grid.className='tools-grid';
    filtered.forEach(t=>{
      const card=document.createElement('div');card.className='tool-card';
      if(t.live)card.classList.add('live');
      card.innerHTML='<span class="icon">'+(ICONS[t.icon]||ICONS.sparkle)+'</span><span class="name">'+t.name+'</span>'+(t.live?'<span class="live-badge">LIVE</span>':'');
      card.onclick=()=>openTool(t);grid.appendChild(card);
    });
    sec.appendChild(grid);list.appendChild(sec);
  });
}
function filterTools(){renderTools(document.getElementById('tools-search-input').value)}
function openTool(tool){
  currentTool=tool;
  document.getElementById('modal-icon').innerHTML=ICONS[tool.icon]||ICONS.sparkle;
  document.getElementById('modal-title').textContent=tool.name;
  document.getElementById('modal-input').value='';
  document.getElementById('modal-input').placeholder=tool.placeholder;
  document.getElementById('modal-result').textContent='';document.getElementById('modal-result').classList.remove('active');
  document.getElementById('modal-actions').style.display='none';
  document.getElementById('modal-run').disabled=false;
  document.getElementById('tool-modal').classList.add('active');
}
function closeModal(){document.getElementById('tool-modal').classList.remove('active');currentTool=null}
async function runTool(){
  if(!currentTool)return;
  const input=document.getElementById('modal-input').value.trim();
  const runBtn=document.getElementById('modal-run');const result=document.getElementById('modal-result');
  runBtn.disabled=true;
  result.textContent=currentTool.live?'Fetching live data...':'Generating...';
  result.classList.add('active');document.getElementById('modal-actions').style.display='none';
  try{
    let res;
    if(currentTool.live){
      res=await fetch('/api/live',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:currentTool.action,input})});
    }else{
      res=await fetch('/api/tool',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:currentTool.prompt,input,provider,language})});
    }
    const data=await res.json();
    if(data.error){result.textContent=data.error}
    else{
      try{result.innerHTML=marked.parse(data.reply)}catch(e){result.textContent=data.reply}
      document.getElementById('modal-actions').style.display='flex';
    }
  }catch(err){result.textContent='Request failed. Is the server running?'}
  runBtn.disabled=false;
}
function copyResult(){
  const text=document.getElementById('modal-result').textContent;
  navigator.clipboard.writeText(text);
  const btn=event.currentTarget;const orig=btn.innerHTML;
  btn.innerHTML=ICONS.check+' Copied!';setTimeout(()=>{btn.innerHTML=orig},2000);
}

// === Init ===
let currentTool=null;
loadProviders();loadSessions();renderTools();
if(window.innerWidth<=768)document.getElementById('sidebar').classList.add('closed');

// PWA
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
</script>
